name: Release build

# Any commit whose subject is `version: <semver>` produces a multi-arch
# docker image (linux/amd64 + linux/arm64) tagged with the version and
# `latest`, and pushes it to the configured registry.
on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: randomcodemonkey.org/autere

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: commit
        name: Resolve version from commit subject (or v-tag)
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            subj="$(git log -1 --pretty=%s)"
            v="$(echo "$subj" | sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$/\1/p')"
            if [[ -z "$v" ]]; then
              echo "::notice::commit subject '$subj' is not 'version: <semver>' — nothing to release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Guard against a tag that disagrees with version.txt
          if [[ ! -f version.txt ]] || [[ "$(cat version.txt | tr -d '[:space:]')" != "$v" ]]; then
            echo "::error::version mismatch: commit/tag says $v, version.txt says $(cat version.txt 2>/dev/null || echo MISSING)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        if: steps.commit.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.commit.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: steps.commit.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOST || 'randomcodemonkey.org' }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push ${{ env.IMAGE }}:${{ steps.commit.outputs.version }}
        if: steps.commit.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.commit.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
