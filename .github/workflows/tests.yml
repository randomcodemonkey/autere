name: Tests

# Every push that is NOT a release version bump runs the full test suite:
# typecheck + lint, component tests, CLI integration tests, extension
# smoke tests, and e2e (real pi turns via 9router).
on:
  push:
    branches: ['**']

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.commit.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: commit
        name: Skip when the commit is a version-bump release commit
        run: |
          subj="$(git log -1 --pretty=%s)"
          if echo "$subj" | grep -qE '^version: [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Component tests run against a dev-server bundle — no 9router needed.
      - name: Component tests
        run: npx cypress install && npm run test:component

      # CLI tests: isolated backend + isolated HOME, no 9router needed.
      - name: CLI integration tests
        run: npm run test:cli

      - name: pi extension smoke tests
        run: node --experimental-strip-types extras/pi-filetools/smoke-test.mjs

      # E2e runs real agent turns against an IN-PROCESS MOCK router
      # (cypress/e2e/support/mock-router.ts) — an OpenAI-compatible endpoint
      # with deterministic responses (streamed essay, "4" for 2+2, one bash
      # tool call). No external 9router needed on the runner.
      - name: Install pi + pi-9router-ext (e2e prerequisites)
        run: |
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.0.0
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/settings.json <<'JSON'
          {
            "defaultProvider": "9router",
            "defaultModel": "mock/chat",
            "enabledModels": ["9router/mock/chat", "9router/mock/chat-mini"],
            "packages": ["npm:pi-9router-ext"],
            "lastChangelogVersion": "1.0.0"
          }
          JSON
          # pi resolves packages under PI_PACKAGE_DIR (~/.pi/agent/npm):
          export PI_PACKAGE_DIR=~/.pi/agent/npm
          pi install npm:pi-9router-ext
          # Repo pi extensions (pi-filetools backs the Changes tab spec —
          # same layout the docker entrypoint uses: symlink into master
          # extensions dir; e2e envs inherit via the shared-dir symlink).
          mkdir -p ~/.pi/agent/extensions
          for d in "$PWD"/extras/*/; do ln -sfn "$PWD/${d#$PWD/}" ~/.pi/agent/extensions/$(basename "$d"); done

      - name: e2e tests
        run: npm run test:e2e

      - name: Upload cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
